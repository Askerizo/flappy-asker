<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Flappy Asker</title>
    <style>
        body {
            margin: 0; padding: 0; background-color: #000;
            overflow: hidden; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none; -webkit-user-select: none;
            display: flex; justify-content: center; align-items: center;
            height: 100vh;
        }

        /* --- Loading Screen --- */
        #loading-screen {
            position: fixed; top: 0; left: 0;
            width: 100vw; height: 100vh;
            background-color: #70c5ce; 
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            z-index: 9999; transition: opacity 0.5s ease;
        }

        .loading-title {
            font-family: 'Courier New', Courier, monospace;
            font-size: 40px; font-weight: 900;
            color: white;
            text-shadow: 2px 2px 0 #000, -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000, 1px 1px 0 #000;
            margin-bottom: 30px; letter-spacing: 2px; text-align: center;
        }

        .loading-bar-bg { width: 200px; height: 10px; background-color: rgba(0,0,0,0.5); border-radius: 10px; overflow: hidden; border: 2px solid white;}
        .loading-bar-fill { width: 0%; height: 100%; background-color: #f1c40f; transition: width 0.2s ease; }

        canvas { 
            display: none; 
            background-color: #70c5ce;
            max-width: 500px;
        }
    </style>
</head>
<body>

    <div id="loading-screen">
        <div class="loading-title">MEMUAT...</div>
        <div class="loading-bar-bg">
            <div class="loading-bar-fill" id="loading-bar"></div>
        </div>
    </div>

    <canvas id="gameCanvas"></canvas>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        const loadingScreen = document.getElementById("loading-screen");
        const loadingBar = document.getElementById("loading-bar");

        function resizeCanvas() {
            canvas.width = Math.min(window.innerWidth, 500);
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        // --- LOAD GAMBAR ---
        const birdImg = new Image();
        birdImg.src = "https://raw.githubusercontent.com/Askerizo/flappy-asker/76996e699d113d041cdde32888f1aadf78608dbc/assets/bird.png"; 

        const pipeTopImg = new Image();
        pipeTopImg.src = "https://raw.githubusercontent.com/Askerizo/flappy-asker/76996e699d113d041cdde32888f1aadf78608dbc/assets/pipe-top.png";

        const pipeBottomImg = new Image();
        pipeBottomImg.src = "https://raw.githubusercontent.com/Askerizo/flappy-asker/76996e699d113d041cdde32888f1aadf78608dbc/assets/pipe-bottom.png";
        
        const bgImg = new Image();
        bgImg.src = "https://raw.githubusercontent.com/Askerizo/flappy-asker/76996e699d113d041cdde32888f1aadf78608dbc/assets/bg.png";

        const baseImg = new Image();
        baseImg.src = "https://raw.githubusercontent.com/Askerizo/flappy-asker/76996e699d113d041cdde32888f1aadf78608dbc/assets/base.png";

        const gameOverImg = new Image();
        gameOverImg.src = "https://raw.githubusercontent.com/Askerizo/flappy-asker/76996e699d113d041cdde32888f1aadf78608dbc/assets/gameover.png";

        let imagesLoaded = 0;
        const totalImages = 6; 

        function checkLoading() {
            imagesLoaded++;
            let progress = (imagesLoaded / totalImages) * 100;
            loadingBar.style.width = progress + "%";

            if (imagesLoaded === totalImages) {
                setTimeout(() => {
                    loadingScreen.style.opacity = "0";
                    setTimeout(() => {
                        loadingScreen.style.display = "none";
                        canvas.style.display = "block";
                        loop(); 
                    }, 500);
                }, 500); 
            }
        }

        birdImg.onload = checkLoading; pipeTopImg.onload = checkLoading; pipeBottomImg.onload = checkLoading;
        bgImg.onload = checkLoading; baseImg.onload = checkLoading; gameOverImg.onload = checkLoading;
        birdImg.onerror = checkLoading; pipeTopImg.onerror = checkLoading; pipeBottomImg.onerror = checkLoading;
        bgImg.onerror = checkLoading; baseImg.onerror = checkLoading; gameOverImg.onerror = checkLoading;


        // --- VARIABEL GAME ---
        const STATE_MENU = 0;
        const STATE_PLAYING = 1;
        const STATE_GAMEOVER = 2;
        
        let currentState = STATE_MENU;
        let frames = 0;
        let score = 0;
        let bestScore = localStorage.getItem("flappyAskerBest") || 0; 

        const baseHeight = 112; 
        const pipeWidth = 52;
        let gap = 150; 
        let gameSpeed = 3; 
        let baseX = 0;

        // --- OBJEK BURUNG ---
        const bird = {
            x: 50, y: 150, width: 34, height: 24, 
            gravity: 0.6, velocity: 0, jump: -8,
            rotation: 0,
            
            draw: function() {
                ctx.save();
                ctx.translate(this.x + this.width/2, this.y + this.height/2);
                if(currentState === STATE_PLAYING || currentState === STATE_GAMEOVER){
                    this.rotation = Math.min(Math.PI / 4, Math.max(-Math.PI / 4, (this.velocity * 0.1)));
                    ctx.rotate(this.rotation);
                }
                ctx.drawImage(birdImg, -this.width/2, -this.height/2, this.width, this.height);
                ctx.restore();
            },
            update: function() {
                this.velocity += this.gravity;
                this.y += this.velocity;
                
                // Nabrak tanah
                if (this.y + this.height >= canvas.height - baseHeight) {
                    this.y = canvas.height - baseHeight - this.height;
                    setGameOver();
                }
                // Mentok atap
                if(this.y <= 0) {
                     this.y = 0;
                     this.velocity = 0;
                }
            },
            flap: function() { this.velocity = this.jump; }
        };

        // --- PIPA ---
        const pipes = [];

        function drawPipes() {
            for (let i = 0; i < pipes.length; i++) {
                let p = pipes[i];
                
                // Gambar Pipa Atas (Perbaikan: memanjangkan pipa ke atas)
                // Gambar badan pipa berulang kali sampai mentok atas
                for(let y = p.top - pipeTopImg.height; y > -pipeTopImg.height; y -= pipeTopImg.height) {
                    ctx.drawImage(pipeTopImg, p.x, y, pipeWidth, pipeTopImg.height);
                }
                
                // Gambar Pipa Bawah (Perbaikan: memanjangkan pipa ke bawah)
                let bottomPipeY = p.top + gap;
                // Gambar badan pipa berulang kali sampai mentok tanah
                for(let y = bottomPipeY; y < canvas.height - baseHeight; y += pipeBottomImg.height) {
                    ctx.drawImage(pipeBottomImg, p.x, y, pipeWidth, pipeBottomImg.height);
                }
                
                if(currentState === STATE_PLAYING) p.x -= gameSpeed; 

                // Cek Tabrakan
                if (currentState === STATE_PLAYING && 
                    bird.x < p.x + pipeWidth && bird.x + bird.width > p.x && 
                    (bird.y < p.top || bird.y + bird.height > p.top + gap)) {
                    setGameOver();
                }

                // Tambah skor (Perbaikan: cek saat burung tepat di tengah pipa)
                if (currentState === STATE_PLAYING && p.x + (pipeWidth/2) === bird.x + (bird.width/2) || 
                   // Fallback kalau kecepatan bikin dia kelewatan pixelnya
                   (p.x + pipeWidth/2 < bird.x + bird.width/2 && p.x + pipeWidth/2 + gameSpeed >= bird.x + bird.width/2) ) {
                    score++;
                }
            }
            
            if (pipes.length > 0 && pipes[0].x < -pipeWidth) pipes.shift();
        }

        function addPipe() {
            let spawnRate = 100; 
            if (currentState === STATE_PLAYING && frames % spawnRate === 0) {
                let minTop = 50; 
                let maxTop = canvas.height - baseHeight - gap - 50; 
                let topHeight = Math.random() * (maxTop - minTop) + minTop;
                pipes.push({ x: canvas.width, top: topHeight });
            }
        }

        function setGameOver() {
            if(currentState !== STATE_GAMEOVER){
                currentState = STATE_GAMEOVER;
                if (score > bestScore) {
                    bestScore = score;
                    localStorage.setItem("flappyAskerBest", bestScore);
                }
            }
        }

        function resetGame() {
            bird.y = canvas.height / 2; bird.velocity = 0; bird.rotation = 0;
            pipes.length = 0; score = 0; frames = 0; 
            currentState = STATE_PLAYING;
            bird.flap(); 
        }

        function handleInput(x, y) {
            if (currentState === STATE_MENU) {
                let btnW = 140, btnH = 50;
                let btnX = canvas.width / 2 - btnW / 2;
                let btnY = canvas.height / 2 + 50;
                if (x >= btnX && x <= btnX + btnW && y >= btnY && y <= btnY + btnH) resetGame();
            } else if (currentState === STATE_PLAYING) {
                bird.flap();
            } else if (currentState === STATE_GAMEOVER) {
                setTimeout(() => { currentState = STATE_MENU; }, 300);
            }
        }

        canvas.addEventListener("mousedown", (e) => {
            const rect = canvas.getBoundingClientRect();
            handleInput(e.clientX - rect.left, e.clientY - rect.top);
        });
        
        canvas.addEventListener("touchstart", (e) => {
            e.preventDefault(); 
            const rect = canvas.getBoundingClientRect();
            handleInput(e.touches[0].clientX - rect.left, e.touches[0].clientY - rect.top);
        }, {passive: false});

        // --- DRAW BACKGROUND & BASE ---
        function drawBackground() {
            // Perbaikan Background: Scale gambar biar pas sampe tanah
            let bgH = canvas.height - baseHeight; // Tinggi area atas tanah
            let bgW = (bgImg.width / bgImg.height) * bgH; // Proporsional lebarnya
            
            for(let i = 0; i <= Math.ceil(canvas.width / bgW); i++) {
                ctx.drawImage(bgImg, i * bgW, 0, bgW, bgH);
            }
        }

        function drawBase() {
            if(currentState === STATE_PLAYING) {
                baseX = (baseX - gameSpeed) % (baseImg.width / 2); 
            }
            for(let i = 0; i <= Math.ceil(canvas.width / baseImg.width) + 1; i++) {
                 ctx.drawImage(baseImg, baseX + (i * baseImg.width), canvas.height - baseHeight);
            }
        }

        // --- UI ---
        function drawScores() {
            ctx.fillStyle = "white";
            ctx.font = "bold 50px 'Courier New'";
            ctx.textAlign = "center";
            ctx.strokeStyle = "black";
            ctx.lineWidth = 6;
            if(currentState === STATE_PLAYING) {
                ctx.strokeText(score, canvas.width/2, 80);
                ctx.fillText(score, canvas.width/2, 80);
            }
        }

        function drawStartMenu() {
            ctx.fillStyle = "white"; ctx.font = "900 40px 'Courier New'";
            ctx.textAlign = "center"; ctx.strokeStyle = "black"; ctx.lineWidth = 5;
            ctx.strokeText("FLAPPY ASKER", canvas.width/2, canvas.height/2 - 60);
            ctx.fillText("FLAPPY ASKER", canvas.width/2, canvas.height/2 - 60);

            let btnW = 140, btnH = 50;
            let btnX = canvas.width / 2 - btnW / 2;
            let btnY = canvas.height / 2 + 50;
            ctx.fillStyle = "black"; ctx.fillRect(btnX - 4, btnY - 4, btnW + 8, btnH + 8); 
            ctx.fillStyle = "#f1c40f"; ctx.fillRect(btnX, btnY, btnW, btnH);
            ctx.fillStyle = "white"; ctx.strokeStyle = "black"; ctx.lineWidth = 3;
            ctx.font = "bold 24px 'Courier New'";
            ctx.strokeText("START", canvas.width/2, btnY + 32);
            ctx.fillText("START", canvas.width/2, btnY + 32);
        }

        function drawGameOver() {
            let goWidth = 192; let goHeight = 42;
            ctx.drawImage(gameOverImg, canvas.width/2 - goWidth/2, canvas.height/2 - 120, goWidth, goHeight);

            // Perbaikan Papan Skor
            ctx.fillStyle = "#ded895";
            ctx.strokeStyle = "black";
            ctx.lineWidth = 4;
            
            let boardW = 200, boardH = 100; // Ukuran kotak dirapihin
            let boardX = canvas.width/2 - boardW/2;
            let boardY = canvas.height/2 - 50;
            
            ctx.fillRect(boardX, boardY, boardW, boardH);
            ctx.strokeRect(boardX, boardY, boardW, boardH);

            ctx.fillStyle = "#e67e22"; // Teks SCORE dan BEST warna oranye
            ctx.font = "bold 16px 'Courier New'";
            ctx.textAlign = "right";
            ctx.fillText("SCORE", boardX + boardW - 20, boardY + 30);
            ctx.fillText("BEST", boardX + boardW - 20, boardY + 75);

            ctx.fillStyle = "white"; // Angka warna putih dengan outline hitam
            ctx.strokeStyle = "black";
            ctx.lineWidth = 3;
            ctx.font = "bold 26px 'Courier New'";
            
            ctx.strokeText(score, boardX + boardW - 20, boardY + 55);
            ctx.fillText(score, boardX + boardW - 20, boardY + 55);
            
            ctx.strokeText(bestScore, boardX + boardW - 20, boardY + 100);
            ctx.fillText(bestScore, boardX + boardW - 20, boardY + 100);
            
            ctx.textAlign = "center";
            ctx.fillStyle = "black";
            ctx.font = "bold 18px 'Courier New'";
            ctx.fillText("Tap to Retry", canvas.width/2, boardY + boardH + 40);
        }

        // --- GAME LOOP ---
        function loop() {
            ctx.fillStyle = "#70c5ce"; 
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            drawBackground();

            if (currentState === STATE_PLAYING) addPipe(); 
            drawPipes();
            drawBase();

            if(currentState === STATE_MENU) {
                bird.y = 150 + Math.sin(frames * 0.1) * 10;
                bird.draw();
                drawStartMenu();
            } 
            else if (currentState === STATE_PLAYING) {
                bird.update(); 
                bird.draw(); 
                drawScores();
            } 
            else if (currentState === STATE_GAMEOVER) {
                if(bird.y + bird.height < canvas.height - baseHeight) {
                    bird.velocity += bird.gravity;
                    bird.y += bird.velocity;
                    bird.rotation = Math.PI / 2; 
                }
                bird.draw();
                drawGameOver();
            }

            frames++;
            requestAnimationFrame(loop);
        }
    </script>
</body>
</html>
