<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Flappy Asker</title>
    <style>
        body {
            margin: 0; padding: 0; background-color: #000;
            overflow: hidden; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none; -webkit-user-select: none;
            display: flex; justify-content: center; align-items: center;
            height: 100vh;
        }

        /* --- Loading Screen --- */
        #loading-screen {
            position: fixed; top: 0; left: 0;
            width: 100vw; height: 100vh;
            background-color: #70c5ce; 
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            z-index: 9999; transition: opacity 0.5s ease;
        }

        .loading-title {
            font-family: 'Courier New', Courier, monospace;
            font-size: 40px; font-weight: 900;
            color: white;
            text-shadow: 2px 2px 0 #000, -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000, 1px 1px 0 #000;
            margin-bottom: 30px; letter-spacing: 2px; text-align: center;
        }

        .loading-bar-bg { width: 200px; height: 10px; background-color: rgba(0,0,0,0.5); border-radius: 10px; overflow: hidden; border: 2px solid white;}
        .loading-bar-fill { width: 0%; height: 100%; background-color: #f1c40f; transition: width 0.2s ease; }

        canvas { 
            display: none; 
            background-color: #70c5ce;
            /* Opsional: Biar kalau di PC gak terlalu lebar, max width-nya dibatesin */
            max-width: 500px;
        }
    </style>
</head>
<body>

    <div id="loading-screen">
        <div class="loading-title">MEMUAT...</div>
        <div class="loading-bar-bg">
            <div class="loading-bar-fill" id="loading-bar"></div>
        </div>
    </div>

    <canvas id="gameCanvas"></canvas>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        const loadingScreen = document.getElementById("loading-screen");
        const loadingBar = document.getElementById("loading-bar");

        function resizeCanvas() {
            // Batasi lebar maksimal untuk PC biar gak aneh
            canvas.width = Math.min(window.innerWidth, 500);
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        // --- LOAD GAMBAR ---
        // Catatan: Pakai raw.githubusercontent.com biar gambarnya bisa di-load sebagai gambar
        const birdImg = new Image();
        birdImg.src = "https://raw.githubusercontent.com/Askerizo/flappy-asker/76996e699d113d041cdde32888f1aadf78608dbc/assets/bird.png"; 

        const pipeTopImg = new Image();
        pipeTopImg.src = "https://raw.githubusercontent.com/Askerizo/flappy-asker/76996e699d113d041cdde32888f1aadf78608dbc/assets/pipe-top.png";

        const pipeBottomImg = new Image();
        pipeBottomImg.src = "https://raw.githubusercontent.com/Askerizo/flappy-asker/76996e699d113d041cdde32888f1aadf78608dbc/assets/pipe-bottom.png";
        
        const bgImg = new Image();
        bgImg.src = "https://raw.githubusercontent.com/Askerizo/flappy-asker/76996e699d113d041cdde32888f1aadf78608dbc/assets/bg.png";

        const baseImg = new Image();
        baseImg.src = "https://raw.githubusercontent.com/Askerizo/flappy-asker/76996e699d113d041cdde32888f1aadf78608dbc/assets/base.png";

        const gameOverImg = new Image();
        gameOverImg.src = "https://raw.githubusercontent.com/Askerizo/flappy-asker/76996e699d113d041cdde32888f1aadf78608dbc/assets/gameover.png";

        // --- SISTEM LOADING ---
        let imagesLoaded = 0;
        const totalImages = 6; 

        function checkLoading() {
            imagesLoaded++;
            let progress = (imagesLoaded / totalImages) * 100;
            loadingBar.style.width = progress + "%";

            if (imagesLoaded === totalImages) {
                setTimeout(() => {
                    loadingScreen.style.opacity = "0";
                    setTimeout(() => {
                        loadingScreen.style.display = "none";
                        canvas.style.display = "block";
                        loop(); 
                    }, 500);
                }, 500); 
            }
        }

        birdImg.onload = checkLoading;
        pipeTopImg.onload = checkLoading;
        pipeBottomImg.onload = checkLoading;
        bgImg.onload = checkLoading;
        baseImg.onload = checkLoading;
        gameOverImg.onload = checkLoading;

        // Fallback kalau gambar gagal di-load
        birdImg.onerror = checkLoading;
        pipeTopImg.onerror = checkLoading;
        pipeBottomImg.onerror = checkLoading;
        bgImg.onerror = checkLoading;
        baseImg.onerror = checkLoading;
        gameOverImg.onerror = checkLoading;


        // --- VARIABEL GAME ---
        const STATE_MENU = 0;
        const STATE_PLAYING = 1;
        const STATE_GAMEOVER = 2;
        
        let currentState = STATE_MENU;
        let frames = 0;
        let score = 0;
        let bestScore = localStorage.getItem("flappyAskerBest") || 0; 

        // Konstanta Ukuran (Disesuaikan biar pas)
        const baseHeight = 112; // Tinggi tanah
        const pipeWidth = 52;
        let gap = 130; // Celah antar pipa (bisa lu kecilin biar lebih susah)
        let gameSpeed = 3; // Kecepatan pipa & tanah

        // Variabel animasi tanah
        let baseX = 0;

        // --- OBJEK BURUNG ---
        const bird = {
            x: 50, y: 150, width: 34, height: 24, 
            gravity: 0.6, velocity: 0, jump: -8,
            rotation: 0,
            
            draw: function() {
                ctx.save();
                ctx.translate(this.x + this.width/2, this.y + this.height/2);
                
                // Rotasi burung kalau jatuh nunduk, kalau lompat dangak
                if(currentState === STATE_PLAYING || currentState === STATE_GAMEOVER){
                    this.rotation = Math.min(Math.PI / 4, Math.max(-Math.PI / 4, (this.velocity * 0.1)));
                    ctx.rotate(this.rotation);
                }
                
                ctx.drawImage(birdImg, -this.width/2, -this.height/2, this.width, this.height);
                ctx.restore();
            },
            update: function() {
                this.velocity += this.gravity;
                this.y += this.velocity;
                
                // Nabrak tanah
                if (this.y + this.height >= canvas.height - baseHeight) {
                    this.y = canvas.height - baseHeight - this.height; // Mentokin di tanah
                    setGameOver();
                }
                // Mentok atap
                if(this.y <= 0) {
                     this.y = 0;
                     this.velocity = 0;
                }
            },
            flap: function() { 
                this.velocity = this.jump; 
            }
        };

        // --- PIPA ---
        const pipes = [];

        function drawPipes() {
            for (let i = 0; i < pipes.length; i++) {
                let p = pipes[i];
                
                // Gambar Pipa Atas
                ctx.drawImage(pipeTopImg, p.x, p.top - pipeTopImg.height, pipeWidth, pipeTopImg.height);
                
                // Gambar Pipa Bawah
                let bottomPipeY = p.top + gap;
                ctx.drawImage(pipeBottomImg, p.x, bottomPipeY, pipeWidth, pipeBottomImg.height);
                
                // Gerakin pipa cuma pas main
                if(currentState === STATE_PLAYING) {
                    p.x -= gameSpeed; 
                }

                // Cek Tabrakan (Cuma pas main)
                if (currentState === STATE_PLAYING && 
                    bird.x < p.x + pipeWidth && bird.x + bird.width > p.x && 
                    (bird.y < p.top || bird.y + bird.height > p.top + gap)) {
                    setGameOver();
                }

                // Tambah skor (Cuma pas main, pas ngelewatin)
                if (currentState === STATE_PLAYING && p.x === bird.x) {
                    score++;
                }
            }
            
            // Hapus pipa yang udah lewat
            if (pipes.length > 0 && pipes[0].x < -pipeWidth) {
                pipes.shift();
            }
        }

        function addPipe() {
            let spawnRate = 100; // Tiap berapa frame pipa muncul
            if (currentState === STATE_PLAYING && frames % spawnRate === 0) {
                let minTop = 50; 
                let maxTop = canvas.height - baseHeight - gap - 50; 
                let topHeight = Math.random() * (maxTop - minTop) + minTop;
                pipes.push({ x: canvas.width, top: topHeight });
            }
        }

        // --- LOGIKA GAME ---
        function setGameOver() {
            if(currentState !== STATE_GAMEOVER){
                currentState = STATE_GAMEOVER;
                if (score > bestScore) {
                    bestScore = score;
                    localStorage.setItem("flappyAskerBest", bestScore);
                }
            }
        }

        function resetGame() {
            bird.y = canvas.height / 2; 
            bird.velocity = 0; 
            bird.rotation = 0;
            pipes.length = 0;
            score = 0; 
            frames = 0; 
            currentState = STATE_PLAYING;
            bird.flap(); // Langsung lompat pas mulai
        }

        // --- KONTROL ---
        function handleInput(x, y) {
            if (currentState === STATE_MENU) {
                let btnW = 140, btnH = 50;
                let btnX = canvas.width / 2 - btnW / 2;
                let btnY = canvas.height / 2 + 50;
                
                if (x >= btnX && x <= btnX + btnW && y >= btnY && y <= btnY + btnH) {
                    resetGame();
                }
            } else if (currentState === STATE_PLAYING) {
                bird.flap();
            } else if (currentState === STATE_GAMEOVER) {
                // Kasih delay dikit biar nggak kepencet ga sengaja pas baru mati
                setTimeout(() => {
                    currentState = STATE_MENU;
                }, 300);
            }
        }

        canvas.addEventListener("mousedown", (e) => {
             // Ambil kordinat klik relatif terhadap canvas (kalau di PC/layar gede)
            const rect = canvas.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;
            handleInput(x, y);
        });
        
        canvas.addEventListener("touchstart", (e) => {
            e.preventDefault(); 
            const rect = canvas.getBoundingClientRect();
            const x = e.touches[0].clientX - rect.left;
            const y = e.touches[0].clientY - rect.top;
            handleInput(x, y);
        }, {passive: false});
        
        document.addEventListener("keydown", (e) => {
            if (e.code === "Space") { 
                if (currentState === STATE_PLAYING) bird.flap();
                else if (currentState === STATE_GAMEOVER) currentState = STATE_MENU;
                else resetGame();
            }
        });

        // --- DRAW BACKGROUND & BASE ---
        function drawBackground() {
            // Gambar bg berulang biar nutupin layar
            for(let i = 0; i <= Math.ceil(canvas.width / bgImg.width); i++) {
                ctx.drawImage(bgImg, i * bgImg.width, canvas.height - baseHeight - bgImg.height);
            }
        }

        function drawBase() {
            // Animasi jalan tanah
            if(currentState === STATE_PLAYING) {
                baseX = (baseX - gameSpeed) % (baseImg.width / 2); // Dibagi 2 atau secukupnya biar mulus loopnya
            }
            
            // Gambar base berulang
            for(let i = 0; i <= Math.ceil(canvas.width / baseImg.width) + 1; i++) {
                 ctx.drawImage(baseImg, baseX + (i * baseImg.width), canvas.height - baseHeight);
            }
        }


        // --- UI ---
        function drawScores() {
            ctx.fillStyle = "white";
            ctx.font = "bold 40px 'Courier New'";
            ctx.textAlign = "center";
            ctx.strokeStyle = "black";
            ctx.lineWidth = 5;

            if(currentState === STATE_PLAYING) {
                // Cuma nunjukin skor gede di atas pas main
                ctx.strokeText(score, canvas.width/2, 80);
                ctx.fillText(score, canvas.width/2, 80);
            }
        }

        function drawStartMenu() {
            // Judul
            ctx.fillStyle = "white";
            ctx.font = "900 40px 'Courier New'";
            ctx.textAlign = "center";
            ctx.strokeStyle = "black";
            ctx.lineWidth = 5;
            ctx.strokeText("FLAPPY ASKER", canvas.width/2, canvas.height/2 - 60);
            ctx.fillText("FLAPPY ASKER", canvas.width/2, canvas.height/2 - 60);

            // Tombol START
            let btnW = 140, btnH = 50;
            let btnX = canvas.width / 2 - btnW / 2;
            let btnY = canvas.height / 2 + 50;

            ctx.fillStyle = "black";
            ctx.fillRect(btnX - 4, btnY - 4, btnW + 8, btnH + 8); 
            ctx.fillStyle = "#f1c40f"; // Kuning
            ctx.fillRect(btnX, btnY, btnW, btnH);

            ctx.fillStyle = "white";
            ctx.strokeStyle = "black";
            ctx.lineWidth = 3;
            ctx.font = "bold 24px 'Courier New'";
            ctx.strokeText("START", canvas.width/2, btnY + 32);
            ctx.fillText("START", canvas.width/2, btnY + 32);
        }

        function drawGameOver() {
            // Gambar Game Over
            let goWidth = 192;
            let goHeight = 42;
            ctx.drawImage(gameOverImg, canvas.width/2 - goWidth/2, canvas.height/2 - 80, goWidth, goHeight);

            // Papan Skor
            ctx.fillStyle = "#ded895";
            ctx.strokeStyle = "black";
            ctx.lineWidth = 4;
            
            let boardW = 220, boardH = 100;
            let boardX = canvas.width/2 - boardW/2;
            let boardY = canvas.height/2 - 10;
            
            ctx.fillRect(boardX, boardY, boardW, boardH);
            ctx.strokeRect(boardX, boardY, boardW, boardH);

            ctx.fillStyle = "black";
            ctx.font = "bold 20px 'Courier New'";
            ctx.textAlign = "right";
            
            ctx.fillText("SCORE", boardX + boardW - 20, boardY + 30);
            ctx.font = "bold 30px 'Courier New'";
            ctx.fillText(score, boardX + boardW - 20, boardY + 60);

            ctx.font = "bold 20px 'Courier New'";
            ctx.fillText("BEST", boardX + boardW - 20, boardY + 80);
            ctx.font = "bold 30px 'Courier New'";
            ctx.fillText(bestScore, boardX + boardW - 20, boardY + 110);
            
            ctx.textAlign = "center";
            ctx.font = "bold 16px 'Courier New'";
            ctx.fillText("Tap to Retry", canvas.width/2, boardY + boardH + 30);
        }


        // --- GAME LOOP ---
        function loop() {
            // 1. Gambar BG
            ctx.fillStyle = "#70c5ce"; 
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            drawBackground();

            // 2. Logic Pipa
            if (currentState === STATE_PLAYING) {
                addPipe(); 
            }
            drawPipes();

            // 3. Gambar Tanah
            drawBase();

            // 4. Logic & Gambar Burung
            if(currentState === STATE_MENU) {
                // Burungnya ngambang-ngambang pas menu
                bird.y = 150 + Math.sin(frames * 0.1) * 10;
                bird.draw();
                drawStartMenu();
            } 
            else if (currentState === STATE_PLAYING) {
                bird.update(); 
                bird.draw(); 
                drawScores();
            } 
            else if (currentState === STATE_GAMEOVER) {
                // Burung jatuh kalau nabrak pipa (gak nabrak tanah)
                if(bird.y + bird.height < canvas.height - baseHeight) {
                    bird.velocity += bird.gravity;
                    bird.y += bird.velocity;
                    bird.rotation = Math.PI / 2; // Nungging ke bawah
                }
                bird.draw();
                drawGameOver();
            }

            frames++;
            requestAnimationFrame(loop);
        }
    </script>
</body>
</html>
