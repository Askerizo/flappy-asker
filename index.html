<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FlappyBird By Asker</title>
    <style>
        body {
            margin: 0; padding: 0; background-color: #000;
            overflow: hidden; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none; -webkit-user-select: none;
            display: flex; justify-content: center; align-items: center;
            height: 100vh;
        }

        #loading-screen {
            position: fixed; top: 0; left: 0;
            width: 100vw; height: 100vh;
            background-color: #70c5ce; 
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            z-index: 9999; transition: opacity 0.5s ease;
        }

        #loading-logo-container {
            margin-bottom: 30px;
            width: 222.5px; 
            height: 60px;
        }

        .loading-bar-bg { width: 200px; height: 10px; background-color: rgba(0,0,0,0.5); border-radius: 10px; overflow: hidden; border: 2px solid white;}
        .loading-bar-fill { width: 0%; height: 100%; background-color: #f1c40f; transition: width 0.2s ease; }

        canvas { 
            display: none; 
            background-color: #000;
            max-width: 500px;
            image-rendering: pixelated; 
        }
    </style>
</head>
<body>

    <div id="loading-screen">
        <canvas id="loadingLogoCanvas" width="222" height="60"></canvas>
        <div style="height: 30px;"></div> 
        <div class="loading-bar-bg">
            <div class="loading-bar-fill" id="loading-bar"></div>
        </div>
    </div>

    <canvas id="gameCanvas"></canvas>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        
        const loadingScreen = document.getElementById("loading-screen");
        const loadingBar = document.getElementById("loading-bar");
        const logoCanvas = document.getElementById("loadingLogoCanvas");
        const logoCtx = logoCanvas.getContext("2d");

        function resizeCanvas() {
            canvas.width = Math.min(window.innerWidth, 500);
            canvas.height = window.innerHeight;
            ctx.imageSmoothingEnabled = false; 
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        const SCALE = 2.5; 

        // ==========================================
        // DATA KOORDINAT SPRITE
        // ==========================================
        const S_BG_DAY = { sx: 0, sy: 0, w: 144, h: 256 };
        const S_BASE   = { sx: 292, sy: 0, w: 168, h: 56 }; 
        const S_BIRD = [
            { sx: 3, sy: 491, w: 17, h: 12 },   
            { sx: 31, sy: 491, w: 17, h: 12 },  
            { sx: 59, sy: 491, w: 17, h: 12 }   
        ];
        const S_PIPE_TOP = { sx: 56, sy: 323, w: 26, h: 160 };
        const S_PIPE_BOT = { sx: 84, sy: 323, w: 26, h: 160 };
        const S_SCOREBOARD = { sx: 3, sy: 259, w: 113, h: 57 };
        const S_PLAY_BTN   = { sx: 354, sy: 118, w: 52, h: 29 };
        const S_TEXT_GET   = { sx: 295, sy: 59, w: 32, h: 21 };
        const S_TEXT_READY = { sx: 329, sy: 59, w: 58, h: 25 };
        const S_TEXT_GAME  = { sx: 395, sy: 59, w: 49, h: 21 };
        const S_TEXT_OVER  = { sx: 449, sy: 59, w: 42, h: 21 };
        
        const S_LOGO_FLAPPY = { sx: 351, sy: 91, w: 89, h: 24 };

        const S_NUMBERS = [
            {sx: 496, sy: 60, w: 12, h: 18}, {sx: 136, sy: 455, w: 8, h: 18}, {sx: 292, sy: 160, w: 12, h: 18},
            {sx: 306, sy: 160, w: 12, h: 18}, {sx: 320, sy: 160, w: 12, h: 18}, {sx: 334, sy: 160, w: 12, h: 18},
            {sx: 292, sy: 184, w: 12, h: 18}, {sx: 306, sy: 184, w: 12, h: 18}, {sx: 320, sy: 184, w: 12, h: 18},
            {sx: 334, sy: 184, w: 12, h: 18}
        ];

        const S_MEDALS = {
            BRONZE:   { sx: 112, sy: 477, w: 22, h: 22 },
            SILVER:   { sx: 112, sy: 453, w: 22, h: 22 },
            GOLD:     { sx: 121, sy: 282, w: 22, h: 22 },
            PLATINUM: { sx: 121, sy: 258, w: 22, h: 22 }
        };

        // --- LOAD SPRITE & LOADING LOGIC ---
        const spriteSheet = new Image();
        spriteSheet.src = "https://raw.githubusercontent.com/Askerizo/flappy-asker/main/assets/sprites.png"; 

        let progress = 0;
        
        spriteSheet.onload = () => {
            logoCtx.imageSmoothingEnabled = false;
            logoCtx.drawImage(
                spriteSheet, 
                S_LOGO_FLAPPY.sx, S_LOGO_FLAPPY.sy, S_LOGO_FLAPPY.w, S_LOGO_FLAPPY.h, 
                0, 0, S_LOGO_FLAPPY.w * SCALE, S_LOGO_FLAPPY.h * SCALE
            );
        };

        const loadingInterval = setInterval(() => {
            progress += 10;
            loadingBar.style.width = progress + "%";
            
            if (progress >= 100 && spriteSheet.complete) {
                clearInterval(loadingInterval);
                setTimeout(() => {
                    loadingScreen.style.opacity = "0";
                    setTimeout(() => {
                        loadingScreen.style.display = "none";
                        canvas.style.display = "block";
                        ctx.imageSmoothingEnabled = false;
                        initGame(); 
                    }, 500);
                }, 400);
            }
        }, 100);

        // --- FUNGSI MENGGAMBAR SPRITE ---
        function drawSprite(sprite, dx, dy, dw = sprite.w * SCALE, dh = sprite.h * SCALE) {
            ctx.drawImage(spriteSheet, sprite.sx, sprite.sy, sprite.w, sprite.h, Math.floor(dx), Math.floor(dy), dw, dh);
        }

        // --- VARIABEL & STATE GAME ---
        const STATE_GETREADY = 0;
        const STATE_PLAYING = 1;
        const STATE_GAMEOVER = 2;
        
        let state = STATE_GETREADY;
        let frames = 0;
        let score = 0;
        let bestScore = localStorage.getItem("flappySpriteBest") || 0; 

        const baseHeight = S_BASE.h * SCALE; 
        const pipeW = S_PIPE_TOP.w * SCALE;
        let gap = 120; 
        let gameSpeed = 3; 
        let playBtnRect = { x: 0, y: 0, w: 0, h: 0 };

        // --- OBJEK ---
        const bg = {
            draw: function() {
                let bgH = S_BG_DAY.h * SCALE;
                let bgW = S_BG_DAY.w * SCALE;
                let bgY = canvas.height - baseHeight - bgH; 
                for(let i = 0; i <= Math.ceil(canvas.width / bgW); i++) {
                    drawSprite(S_BG_DAY, i * bgW, bgY, bgW, bgH);
                    if(bgY > 0) { ctx.fillStyle = "#4ec0ca"; ctx.fillRect(i * bgW, 0, bgW, bgY); }
                }
            }
        };

        const ground = {
            x: 0,
            draw: function() {
                if(state === STATE_PLAYING) { this.x = (this.x - gameSpeed) % ((S_BASE.w * SCALE) / 2); }
                for(let i = 0; i <= Math.ceil(canvas.width / (S_BASE.w * SCALE)) + 1; i++) {
                     drawSprite(S_BASE, this.x + (i * (S_BASE.w * SCALE)), canvas.height - baseHeight);
                }
            }
        };

        const bird = {
            x: 50, y: 150, w: S_BIRD[0].w * SCALE, h: S_BIRD[0].h * SCALE,
            gravity: 0.4, velocity: 0, jump: -6, rotation: 0, frame: 0,
            draw: function() {
                let currentSprite = S_BIRD[0];
                if(state === STATE_PLAYING || state === STATE_GETREADY) {
                    this.frame += 0.15;
                    currentSprite = S_BIRD[Math.floor(this.frame) % 3];
                }
                ctx.save();
                ctx.translate(this.x + this.w/2, this.y + this.h/2);
                if(state === STATE_PLAYING || state === STATE_GAMEOVER){
                    this.rotation = Math.min(Math.PI / 2, Math.max(-Math.PI / 6, (this.velocity * 0.1)));
                    ctx.rotate(this.rotation);
                }
                drawSprite(currentSprite, -this.w/2, -this.h/2);
                ctx.restore();
            },
            update: function() {
                this.velocity += this.gravity;
                this.y += this.velocity;
                if (this.y + this.h >= canvas.height - baseHeight) {
                    this.y = canvas.height - baseHeight - this.h;
                    setGameOver();
                }
                if(this.y <= 0) { this.y = 0; this.velocity = 0; }
            },
            flap: function() { this.velocity = this.jump; }
        };

        const pipes = [];

        function drawPipes() {
            for (let i = 0; i < pipes.length; i++) {
                let p = pipes[i];
                let pH = S_PIPE_TOP.h * SCALE;
                drawSprite(S_PIPE_TOP, p.x, p.top - pH);
                drawSprite(S_PIPE_BOT, p.x, p.top + gap);
                if(state === STATE_PLAYING) p.x -= gameSpeed; 

                // Perbaiki toleransi hitbox agar tidak terlalu sulit
                let tolerance = 5; 
                if (state === STATE_PLAYING && 
                    bird.x + tolerance < p.x + pipeW && bird.x + bird.w - tolerance > p.x && 
                    (bird.y + tolerance < p.top || bird.y + bird.h - tolerance > p.top + gap)) {
                    setGameOver();
                }
                if (state === STATE_PLAYING && p.x + (pipeW/2) === bird.x + (bird.w/2) || 
                   (p.x + pipeW/2 < bird.x + bird.w/2 && p.x + pipeW/2 + gameSpeed >= bird.x + bird.w/2) ) {
                    score++;
                }
            }
            if (pipes.length > 0 && pipes[0].x < -pipeW) pipes.shift();
        }

        function addPipe() {
            if (state === STATE_PLAYING && frames % 100 === 0) {
                let minTop = 50; let maxTop = canvas.height - baseHeight - gap - 50; 
                let topHeight = Math.random() * (maxTop - minTop) + minTop;
                pipes.push({ x: canvas.width, top: topHeight });
            }
        }

        function drawScoreImages(num, x, y, numScale = 1, align = "center") {
            let numStr = num.toString();
            let totalWidth = 0;
            // Spacing disesuaikan dengan scale
            let spacing = 1 * numScale * SCALE; 

            for(let i=0; i<numStr.length; i++) {
                let n = parseInt(numStr[i]);
                totalWidth += (S_NUMBERS[n].w * numScale * SCALE) + spacing;
            }
            totalWidth -= spacing; 

            let currentX = x;
            if (align === "center") currentX = x - (totalWidth / 2);
            else if (align === "right") currentX = x - totalWidth;

            for(let i=0; i<numStr.length; i++) {
                let n = parseInt(numStr[i]);
                let w = S_NUMBERS[n].w * numScale * SCALE;
                let h = S_NUMBERS[n].h * numScale * SCALE;
                drawSprite(S_NUMBERS[n], currentX, y, w, h);
                currentX += w + spacing;
            }
        }

        function drawUI() {
            if (state === STATE_GETREADY) {
                let logoW = S_LOGO_FLAPPY.w * SCALE;
                let logoH = S_LOGO_FLAPPY.h * SCALE;
                drawSprite(S_LOGO_FLAPPY, canvas.width/2 - logoW/2, canvas.height/2 - 150);

                let totalW = (S_TEXT_GET.w + S_TEXT_READY.w + 5) * SCALE;
                let textY = canvas.height/2 - 80;
                drawSprite(S_TEXT_GET, canvas.width/2 - totalW/2, textY);
                drawSprite(S_TEXT_READY, canvas.width/2 - totalW/2 + (S_TEXT_GET.w * SCALE) + 10, textY);
                
                playBtnRect.w = S_PLAY_BTN.w * SCALE; playBtnRect.h = S_PLAY_BTN.h * SCALE;
                playBtnRect.x = canvas.width/2 - playBtnRect.w/2; playBtnRect.y = canvas.height/2;
                drawSprite(S_PLAY_BTN, playBtnRect.x, playBtnRect.y);

            } else if (state === STATE_PLAYING) {
                drawScoreImages(score, canvas.width/2, 50, 1.2, "center"); 

            } else if (state === STATE_GAMEOVER) {
                let totalW = (S_TEXT_GAME.w + S_TEXT_OVER.w + 5) * SCALE;
                let textY = canvas.height/2 - 150;
                drawSprite(S_TEXT_GAME, canvas.width/2 - totalW/2, textY);
                drawSprite(S_TEXT_OVER, canvas.width/2 - totalW/2 + (S_TEXT_GAME.w * SCALE) + 10, textY);

                let boardW = S_SCOREBOARD.w * SCALE;
                let boardH = S_SCOREBOARD.h * SCALE;
                let boardX = canvas.width/2 - boardW/2;
                let boardY = canvas.height/2 - 50;
                drawSprite(S_SCOREBOARD, boardX, boardY);

                // --- ANGKA LEBIH KECIL (0.45) DAN DIGESER Y-NYA ---
                drawScoreImages(score, boardX + boardW - 25, boardY + 42, 0.45, "right");
                drawScoreImages(bestScore, boardX + boardW - 25, boardY + 84, 0.45, "right");

                let medalSprite = null;
                if (score >= 40) medalSprite = S_MEDALS.PLATINUM;
                else if (score >= 30) medalSprite = S_MEDALS.GOLD;
                else if (score >= 20) medalSprite = S_MEDALS.SILVER;
                else if (score >= 10) medalSprite = S_MEDALS.BRONZE;

                if (medalSprite) {
                    let medalX = boardX + (boardW * 0.23); 
                    let medalY = boardY + (boardH * 0.40); 
                    drawSprite(medalSprite, medalX, medalY);
                }

                playBtnRect.x = canvas.width/2 - playBtnRect.w/2;
                playBtnRect.y = boardY + boardH + 20;
                drawSprite(S_PLAY_BTN, playBtnRect.x, playBtnRect.y);
            }
        }

        function setGameOver() {
            if(state !== STATE_GAMEOVER){
                state = STATE_GAMEOVER;
                if (score > bestScore) {
                    bestScore = score;
                    localStorage.setItem("flappySpriteBest", bestScore);
                }
            }
        }

        function resetGame() {
            bird.y = canvas.height / 2; bird.velocity = 0; bird.rotation = 0;
            pipes.length = 0; score = 0; frames = 0; 
            state = STATE_PLAYING;
            bird.flap(); 
        }

        function handleInput(e) {
            let rect = canvas.getBoundingClientRect();
            let clickX, clickY;
            if (e.type === 'touchstart') {
                clickX = e.touches[0].clientX - rect.left;
                clickY = e.touches[0].clientY - rect.top;
            } else {
                clickX = e.clientX - rect.left;
                clickY = e.clientY - rect.top;
            }

            if(state === STATE_GETREADY) {
                if (clickX >= playBtnRect.x && clickX <= playBtnRect.x + playBtnRect.w &&
                    clickY >= playBtnRect.y && clickY <= playBtnRect.y + playBtnRect.h) {
                    resetGame();
                }
            } else if (state === STATE_PLAYING) {
                bird.flap();
            } else if (state === STATE_GAMEOVER) {
                if (clickX >= playBtnRect.x && clickX <= playBtnRect.x + playBtnRect.w &&
                    clickY >= playBtnRect.y && clickY <= playBtnRect.y + playBtnRect.h) {
                    setTimeout(() => { state = STATE_GETREADY; }, 100);
                }
            }
        }

        canvas.addEventListener("mousedown", handleInput);
        canvas.addEventListener("touchstart", (e) => { e.preventDefault(); handleInput(e); }, {passive: false});
        document.addEventListener("keydown", (e) => { 
            if (e.code === "Space") {
                if (state === STATE_PLAYING) bird.flap();
                else if (state === STATE_GETREADY || state === STATE_GAMEOVER) resetGame();
            } 
        });

        function loop() {
            ctx.fillStyle = "#4ec0ca"; ctx.fillRect(0, 0, canvas.width, canvas.height);
            bg.draw();
            if (state === STATE_PLAYING) addPipe(); 
            drawPipes();
            ground.draw();
            if(state === STATE_GETREADY) { bird.y = 150 + Math.sin(frames * 0.1) * 5; bird.draw(); } 
            else if (state === STATE_PLAYING) { bird.update(); bird.draw(); } 
            else if (state === STATE_GAMEOVER) {
                if(bird.y + bird.h < canvas.height - baseHeight) {
                    bird.velocity += bird.gravity; bird.y += bird.velocity; bird.rotation = Math.PI / 2; 
                }
                bird.draw();
            }
            drawUI();
            frames++;
            requestAnimationFrame(loop);
        }

        function initGame() { loop(); }
    </script>
</body>
</html>
