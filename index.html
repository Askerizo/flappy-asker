<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flappy Kotak</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #2c3e50;
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }
        canvas {
            background-color: #70c5ce; /* Warna langit */
            border: 4px solid #fff;
            border-radius: 8px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.5);
            max-width: 100%;
        }
        h1 { margin-bottom: 5px; }
        p { margin-top: 0; color: #bdc3c7; }
    </style>
</head>
<body>

    <h1>Flappy Kotak</h1>
    <p>Tap layar atau tekan SPASI untuk lompat</p>
    <canvas id="gameCanvas" width="320" height="480"></canvas>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        // Variabel Game
        let frames = 0;
        let score = 0;
        let gameOver = false;

        // Objek Burung (Kotak Kuning)
        const bird = {
            x: 50,
            y: 150,
            width: 20,
            height: 20,
            gravity: 0.5,
            velocity: 0,
            jump: -7,
            
            draw: function() {
                ctx.fillStyle = "#f1c40f"; // Kuning
                ctx.fillRect(this.x, this.y, this.width, this.height);
                // Kasih mata kecil biar lucu
                ctx.fillStyle = "black";
                ctx.fillRect(this.x + 12, this.y + 4, 4, 4);
            },
            
            update: function() {
                this.velocity += this.gravity;
                this.y += this.velocity;
                
                // Nabrak lantai atau langit-langit
                if (this.y + this.height >= canvas.height || this.y <= 0) {
                    gameOver = true;
                }
            },
            
            flap: function() {
                this.velocity = this.jump;
            }
        };

        // Objek Pipa
        const pipes = [];
        const pipeWidth = 40;
        const gap = 110; // Jarak celah buat lewat

        function drawPipes() {
            for (let i = 0; i < pipes.length; i++) {
                let p = pipes[i];
                
                ctx.fillStyle = "#2ecc71"; // Hijau
                
                // Pipa Atas
                ctx.fillRect(p.x, 0, pipeWidth, p.top);
                // Pipa Bawah
                ctx.fillRect(p.x, p.top + gap, pipeWidth, canvas.height - p.top - gap);
                
                // Gerakin pipa ke kiri
                p.x -= 2;

                // Cek tabrakan
                if (bird.x < p.x + pipeWidth && 
                    bird.x + bird.width > p.x && 
                    (bird.y < p.top || bird.y + bird.height > p.top + gap)) {
                    gameOver = true;
                }

                // Nambah Skor kalau berhasil ngelewatin pipa
                if (p.x === bird.x) {
                    score++;
                }
            }
            
            // Hapus pipa yang udah keluar layar biar gak berat
            if (pipes.length > 0 && pipes[0].x < -pipeWidth) {
                pipes.shift();
            }
        }

        // Bikin pipa baru setiap 100 frame
        function addPipe() {
            if (frames % 100 === 0) {
                // Tinggi pipa atas diacak
                let topHeight = Math.random() * (canvas.height - gap - 40) + 20;
                pipes.push({ x: canvas.width, top: topHeight });
            }
        }

        // Fungsi Reset Game
        function resetGame() {
            bird.y = 150;
            bird.velocity = 0;
            pipes.length = 0;
            score = 0;
            frames = 0;
            gameOver = false;
            loop();
        }

        // Kontrol
        document.addEventListener("keydown", (e) => {
            if (e.code === "Space") {
                if (gameOver) resetGame();
                else bird.flap();
            }
        });
        
        canvas.addEventListener("mousedown", () => {
            if (gameOver) resetGame();
            else bird.flap();
        });
        
        canvas.addEventListener("touchstart", (e) => {
            e.preventDefault(); // Biar layar HP gak scroll
            if (gameOver) resetGame();
            else bird.flap();
        }, {passive: false});

        // Game Loop Utama
        function loop() {
            if (gameOver) {
                ctx.fillStyle = "rgba(0, 0, 0, 0.7)";
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                
                ctx.fillStyle = "white";
                ctx.font = "30px Arial";
                ctx.textAlign = "center";
                ctx.fillText("YAH KALAH!", canvas.width/2, canvas.height/2 - 20);
                
                ctx.font = "20px Arial";
                ctx.fillText("Skor Lu: " + score, canvas.width/2, canvas.height/2 + 20);
                ctx.fillText("Tap buat main lagi", canvas.width/2, canvas.height/2 + 60);
                return; // Stop animasi
            }
            
            // Bersihin layar tiap frame
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // Gambar & Update
            bird.draw();
            bird.update();
            
            addPipe();
            drawPipes();
            
            // Gambar Teks Skor
            ctx.fillStyle = "black";
            ctx.font = "24px Arial";
            ctx.textAlign = "left";
            ctx.fillText("Skor: " + score, 10, 30);
            
            frames++;
            requestAnimationFrame(loop);
        }

        // Mulai Game
        loop();
    </script>
</body>
</html>
