<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Flappy Asker - Sprite Version</title>
    <style>
        body {
            margin: 0; padding: 0; background-color: #000;
            overflow: hidden; font-family: sans-serif;
            user-select: none; -webkit-user-select: none;
            display: flex; justify-content: center; align-items: center;
            height: 100vh;
        }
        canvas { 
            display: block; 
            max-width: 500px; /* Batas lebar untuk PC */
            background-color: #000; /* Warna hitam kalau gambar gagal load */
        }
        #loading {
            position: absolute; color: white; font-size: 24px;
        }
    </style>
</head>
<body>

    <div id="loading">Memuat Gambar...</div>
    <canvas id="gameCanvas"></canvas>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        const loadingText = document.getElementById("loading");

        // --- RESPONSIVE CANVAS ---
        function resizeCanvas() {
            canvas.width = Math.min(window.innerWidth, 500);
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        // --- LOAD SPRITE SHEET ---
        const spriteSheet = new Image();
        // Ganti URL ini kalau link gambar lu beda
        spriteSheet.src = "https://raw.githubusercontent.com/Askerizo/flappy-asker/main/assets/sprites.png"; 

        spriteSheet.onload = () => {
            loadingText.style.display = "none";
            initGame();
        };

        // ==========================================
        // TUGAS LU: ISI KOORDINAT DI BAWAH INI (px)
        // Format: { sx: x_di_gambar, sy: y_di_gambar, w: lebar, h: tinggi }
        // ==========================================
        
        // Contoh perkiraan kasar (Lu harus cek di Photoshop/Paint buat dapet angka pasnya):
        const SPRITE_BG_DAY = { sx: 0, sy: 0, w: 288, h: 512 }; // Background siang
        const SPRITE_BASE   = { sx: 584, sy: 0, w: 336, h: 112 }; // Tanah
        
        const SPRITE_BIRD_1 = { sx: 230, sy: 762, w: 34, h: 24 }; // Burung sayap bawah
        const SPRITE_BIRD_2 = { sx: 230, sy: 814, w: 34, h: 24 }; // Burung sayap tengah
        const SPRITE_BIRD_3 = { sx: 230, sy: 866, w: 34, h: 24 }; // Burung sayap atas
        
        const SPRITE_PIPE_TOP = { sx: 112, sy: 646, w: 52, h: 320 }; // Pipa dari atas (hijau)
        const SPRITE_PIPE_BOT = { sx: 168, sy: 646, w: 52, h: 320 }; // Pipa dari bawah (hijau)
        
        const SPRITE_GET_READY = { sx: 590, sy: 118, w: 184, h: 50 }; // Tulisan Get Ready
        const SPRITE_GAME_OVER = { sx: 790, sy: 118, w: 192, h: 42 }; // Tulisan Game Over

        // Angka (Kecil untuk skor saat main, atau besar? Coba sesuaikan)
        const NUMBERS = [
            { sx: 992, sy: 120, w: 24, h: 36 }, // 0
            { sx: 272, sy: 910, w: 16, h: 36 }, // 1
            { sx: 584, sy: 320, w: 24, h: 36 }, // 2
            { sx: 612, sy: 320, w: 24, h: 36 }, // 3
            { sx: 640, sy: 320, w: 24, h: 36 }, // 4
            { sx: 668, sy: 320, w: 24, h: 36 }, // 5
            { sx: 584, sy: 368, w: 24, h: 36 }, // 6
            { sx: 612, sy: 368, w: 24, h: 36 }, // 7
            { sx: 640, sy: 368, w: 24, h: 36 }, // 8
            { sx: 668, sy: 368, w: 24, h: 36 }  // 9
        ];
        // ==========================================


        // --- FUNGSI MENGGAMBAR SPRITE ---
        // dx, dy = posisi di canvas. dw, dh = ukuran di canvas (bisa di-scale)
        function drawSprite(sprite, dx, dy, dw = sprite.w, dh = sprite.h) {
            ctx.drawImage(
                spriteSheet, 
                sprite.sx, sprite.sy, sprite.w, sprite.h, // Potong dari gambar sumber
                dx, dy, dw, dh                            // Taruh di canvas
            );
        }

        // --- VARIABEL & STATE GAME ---
        const STATE_GETREADY = 0;
        const STATE_PLAYING = 1;
        const STATE_GAMEOVER = 2;
        
        let state = STATE_GETREADY;
        let frames = 0;
        let score = 0;
        let gameSpeed = 2;
        let baseX = 0;

        // --- OBJEK ---
        const bg = {
            draw: function() {
                // Scale background biar menuhin lebar layar, tapi tingginya dikurangi area tanah
                let bgHeight = canvas.height - SPRITE_BASE.h;
                let scale = bgHeight / SPRITE_BG_DAY.h;
                let bgWidth = SPRITE_BG_DAY.w * scale;

                for(let i = 0; i <= Math.ceil(canvas.width / bgWidth); i++) {
                    drawSprite(SPRITE_BG_DAY, i * bgWidth, 0, bgWidth, bgHeight);
                }
            }
        };

        const ground = {
            draw: function() {
                if(state === STATE_PLAYING) {
                    baseX = (baseX - gameSpeed) % (SPRITE_BASE.w / 2); 
                }
                for(let i = 0; i <= Math.ceil(canvas.width / SPRITE_BASE.w) + 1; i++) {
                     drawSprite(SPRITE_BASE, baseX + (i * SPRITE_BASE.w), canvas.height - SPRITE_BASE.h, SPRITE_BASE.w, SPRITE_BASE.h);
                }
            }
        };

        const bird = {
            x: 50, y: 150, width: SPRITE_BIRD_1.w, height: SPRITE_BIRD_1.h,
            gravity: 0.25, velocity: 0, jump: -4.6, rotation: 0,
            frame: 0,
            
            draw: function() {
                let currentSprite = SPRITE_BIRD_1;
                // Animasi kepak sayap
                if(state === STATE_PLAYING || state === STATE_GETREADY) {
                    this.frame += 0.1;
                    if(this.frame % 3 < 1) currentSprite = SPRITE_BIRD_1;
                    else if(this.frame % 3 < 2) currentSprite = SPRITE_BIRD_2;
                    else currentSprite = SPRITE_BIRD_3;
                }

                ctx.save();
                ctx.translate(this.x + this.width/2, this.y + this.height/2);
                
                if(state === STATE_PLAYING || state === STATE_GAMEOVER){
                    this.rotation = Math.min(Math.PI / 4, Math.max(-Math.PI / 4, (this.velocity * 0.1)));
                    ctx.rotate(this.rotation);
                }
                
                drawSprite(currentSprite, -this.width/2, -this.height/2);
                ctx.restore();
            },
            update: function() {
                this.velocity += this.gravity;
                this.y += this.velocity;
                
                if (this.y + this.height >= canvas.height - SPRITE_BASE.h) {
                    this.y = canvas.height - SPRITE_BASE.h - this.height;
                    state = STATE_GAMEOVER;
                }
                if(this.y <= 0) {
                     this.y = 0; this.velocity = 0;
                }
            },
            flap: function() { this.velocity = this.jump; }
        };

        // (Bagian Pipa dan UI menyusul setelah lu dapet koordinatnya)
        
        function drawScore(num, x, y) {
            // (Fungsi gambar skor menyusul)
        }

        // --- KONTROL ---
        canvas.addEventListener("mousedown", handleAction);
        canvas.addEventListener("touchstart", (e) => { e.preventDefault(); handleAction(); }, {passive: false});

        function handleAction() {
            if(state === STATE_GETREADY) {
                state = STATE_PLAYING;
                bird.flap();
            } else if (state === STATE_PLAYING) {
                bird.flap();
            } else if (state === STATE_GAMEOVER) {
                bird.y = 150; bird.velocity = 0; bird.rotation = 0;
                state = STATE_GETREADY;
            }
        }

        // --- GAME LOOP ---
        function loop() {
            bg.draw();
            
            // pipes.update & draw (nanti)

            ground.draw();

            if(state === STATE_GETREADY) {
                bird.y = 150 + Math.sin(frames * 0.1) * 5;
                bird.draw();
                drawSprite(SPRITE_GET_READY, canvas.width/2 - SPRITE_GET_READY.w/2, canvas.height/2 - 50);
            } 
            else if (state === STATE_PLAYING) {
                bird.update(); 
                bird.draw(); 
            } 
            else if (state === STATE_GAMEOVER) {
                if(bird.y + bird.height < canvas.height - SPRITE_BASE.h) {
                    bird.velocity += bird.gravity;
                    bird.y += bird.velocity;
                    bird.rotation = Math.PI / 2; 
                }
                bird.draw();
                drawSprite(SPRITE_GAME_OVER, canvas.width/2 - SPRITE_GAME_OVER.w/2, canvas.height/2 - 50);
            }

            frames++;
            requestAnimationFrame(loop);
        }

        function initGame() {
            loop();
        }

    </script>
</body>
</html>
